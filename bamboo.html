  <style>
    :root {
      --bg: #f5f0e8;
      --card: #ffffff;
      --primary: #2e7d32;
      --primary-light: #4caf50;
      --accent: #ff8f00;
      --text: #1a1a1a;
      --muted: #666;
      --border: #e0d8c8;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 60%, #388e3c 100%);
      color: #fff;
      padding: 32px 24px 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 1px;
      position: relative;
    }
    header p.subtitle {
      margin-top: 8px;
      font-size: 0.95rem;
      opacity: 0.85;
      position: relative;
    }

    /* ── SEARCH DATE BANNER ── */
    .search-date-banner {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 10px;
      padding: 10px 20px;
      margin: 14px auto 0;
      max-width: 600px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 0.88rem;
    }
    .search-date-banner .label { opacity: 0.8; }
    .search-date-banner .date-val { font-weight: 700; font-size: 1rem; color: #a5d6a7; }

    .keywords {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 16px;
      position: relative;
    }
    .kw-tag {
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 20px;
      position: relative;
    }
    .stat { text-align: center; }
    .stat-num { font-size: 1.8rem; font-weight: 800; color: #a5d6a7; }
    .stat-label { font-size: 0.75rem; opacity: 0.8; margin-top: 2px; }

    /* ── SEARCH BAR ── */
    .search-wrap {
      max-width: 760px;
      margin: 24px auto 0;
      padding: 0 16px;
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 14px 52px 14px 20px;
      border-radius: 40px;
      border: 2px solid var(--border);
      font-size: 1rem;
      outline: none;
      background: #fff;
      box-shadow: var(--shadow);
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: var(--primary-light); }

    /* ── SORT & FILTER ROW ── */
    .controls-wrap {
      max-width: 1200px;
      margin: 16px auto 0;
      padding: 0 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
    }
    .filter-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .filter-btn {
      padding: 8px 18px;
      border-radius: 24px;
      border: 2px solid var(--border);
      background: #fff;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .filter-btn:hover { border-color: var(--primary-light); color: var(--primary); }
    .filter-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .filter-btn .badge {
      background: rgba(255,255,255,0.25);
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 0.75rem;
    }
    .filter-btn:not(.active) .badge { background: #e8f5e9; color: var(--primary); }

    /* ── SORT CONTROL ── */
    .sort-control {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 2px solid var(--border);
      border-radius: 24px;
      padding: 7px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .sort-control:hover { border-color: var(--primary-light); }
    .sort-control select {
      border: none;
      outline: none;
      background: transparent;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--primary);
    }

    /* ── NEWEST POST HIGHLIGHT ── */
    .newest-banner {
      max-width: 1200px;
      margin: 16px auto 0;
      padding: 0 16px;
    }
    .newest-banner-inner {
      background: linear-gradient(90deg, #e8f5e9, #f1f8e9);
      border: 1.5px solid #a5d6a7;
      border-radius: 10px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      flex-wrap: wrap;
    }
    .newest-banner-inner strong { color: var(--primary); }
    .newest-tag {
      background: var(--primary);
      color: #fff;
      border-radius: 6px;
      padding: 2px 10px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    /* ── MAIN GRID ── */
    .main {
      max-width: 1200px;
      margin: 20px auto 40px;
      padding: 0 16px;
    }
    .section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border);
    }
    .platform-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .section-title { font-size: 1.2rem; font-weight: 700; color: var(--primary); }
    .section-count {
      margin-left: auto;
      font-size: 0.82rem;
      color: var(--muted);
      background: #e8f5e9;
      padding: 3px 10px;
      border-radius: 12px;
    }
    .section-newest {
      font-size: 0.78rem;
      color: var(--primary);
      background: #c8e6c9;
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: 600;
    }

    /* ── CARD GRID ── */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 18px;
      box-shadow: var(--shadow);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 24px rgba(0,0,0,0.12);
    }
    .card.is-newest {
      border-color: #81c784;
      box-shadow: 0 2px 16px rgba(46,125,50,0.15);
    }
    .newest-ribbon {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--primary);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }
    .card-platform {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 12px;
      width: fit-content;
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.4;
      color: var(--text);
      padding-right: 50px;
    }
    .card-summary {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ── DATE ROW ── */
    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--muted);
      flex-wrap: wrap;
    }
    .card-meta .account { font-weight: 600; color: var(--primary); }
    .post-date {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #e8f5e9;
      color: #2e7d32;
      border-radius: 8px;
      padding: 3px 9px;
      font-size: 0.75rem;
      font-weight: 700;
      border: 1px solid #c8e6c9;
    }
    .post-date.unknown {
      background: #f5f5f5;
      color: #999;
      border-color: #e0e0e0;
    }
    .post-date.social {
      background: #fff3e0;
      color: #e65100;
      border-color: #ffe0b2;
    }

    .card-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: var(--primary);
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      margin-top: auto;
      transition: background 0.2s;
    }
    .card-link:hover { background: #1b5e20; }

    /* ── PLATFORM COLORS ── */
    .p-google    { background: #fce4ec; color: #c62828; }

    .p-instagram { background: #fff3e0; color: #e65100; }
    .p-xiaohongshu { background: #fce4ec; color: #ad1457; }
    .p-tiktok    { background: #e0f7fa; color: #00695c; }
    .icon-google    { background: #fce4ec; }
    .icon-facebook  { background: #e3f2fd; }
    .icon-threads   { background: #f3e5f5; }
    .icon-instagram { background: #fff3e0; }
    .icon-xiaohongshu { background: #fce4ec; }
    .icon-tiktok    { background: #e0f7fa; }

    /* ── EMPTY / NO RESULTS ── */
    #no-results { display: none; text-align: center; padding: 60px 20px; color: var(--muted); }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.78rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      header h1 { font-size: 1.4rem; }
      .cards-grid { grid-template-columns: 1fr; }
      .stats-bar { gap: 16px; }
    }
  </style>
</head>
<body>

<header>

  <div class="keywords">

<div class="controls-wrap">

    <button class="filter-btn" data-platform="Instagram" onclick="setFilter('Instagram',this)">📸 Instagram <span class="badge" id="badge-Instagram">0</span></button>
    <button class="filter-btn" data-platform="小紅書"    onclick="setFilter('小紅書',this)">📕 小紅書 <span class="badge" id="badge-小紅書">0</span></button>
    <button class="filter-btn" data-platform="TikTok"    onclick="setFilter('TikTok',this)">🎵 TikTok <span class="badge" id="badge-TikTok">0</span></button>
  </div>
  <div class="sort-control">
    <span>排序：</span>

      <option value="platform">按平台</option>

  </div>
</div>

<div class="newest-banner" id="newestBanner" style="display:none">

const SEARCH_TIMESTAMP = new Date();
function formatHKT(d) {
  return d.toLocaleString('zh-HK', {
    timeZone: 'Asia/Hong_Kong',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
    hour12: false
  });
}
function formatHKTDate(d) {
  return d.toLocaleDateString('zh-HK', {
    timeZone: 'Asia/Hong_Kong',
    year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
  });
}
document.getElementById('searchDateDisplay').textContent = formatHKT(SEARCH_TIMESTAMP);

  currentFilter = platform;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));

// ── DATE HELPERS ──
function parseDate(str) {
  if (!str || str === 'unknown') return null;
  const d = new Date(str + 'T00:00:00+08:00');
  return isNaN(d.getTime()) ? null : d;
}
function formatDisplayDate(str) {
  const d = parseDate(str);
  if (!d) return null;
  return d.toLocaleDateString('zh-HK', { year: 'numeric', month: 'long', day: 'numeric' });
}
function isSocialPlatform(platform) {
  return ['Facebook', 'Instagram', 'Threads', '小紅書', 'TikTok'].includes(platform);
}

// ── FLATTEN & SORT ──
function getFlatResults() {
  let flat = [];
  ALL_DATA.forEach(section => {
    section.results.forEach(r => {
      flat.push({ ...r, platform: section.platform });
    });
  });
  return flat;
}

function sortResults(arr, mode) {
  const copy = [...arr];
  if (mode === 'date-desc') {
    copy.sort((a, b) => {
      const da = parseDate(a.date), db = parseDate(b.date);
      if (da && db) return db - da;
      if (da) return -1;
      if (db) return 1;
      return 0;
    });
  } else if (mode === 'date-asc') {
    copy.sort((a, b) => {
      const da = parseDate(a.date), db = parseDate(b.date);
      if (da && db) return da - db;
      if (da) return 1;
      if (db) return -1;
      return 0;
    });
  } else {
    // by platform order
    const order = ['Facebook','Instagram','Threads','Google','TikTok','小紅書'];
    copy.sort((a, b) => order.indexOf(a.platform) - order.indexOf(b.platform));
  }
  return copy;
}

// ── RENDER ──
function renderAll() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const sortMode = document.getElementById('sortSelect').value;
  const container = document.getElementById('mainContent');
  container.innerHTML = '';

  // Filter
  let flat = getFlatResults().filter(r => {
    if (currentFilter !== 'all' && r.platform !== currentFilter) return false;
    if (query) {
      return (r.title + ' ' + (r.summary || '') + ' ' + (r.account || '')).toLowerCase().includes(query);
    }
    return true;
  });

  // Update badges
  const allFlat = getFlatResults();
  const platforms = ['Google','Facebook','Threads','Instagram','小紅書','TikTok'];
  document.getElementById('badge-all').textContent = allFlat.filter(r => !query || (r.title+r.summary+r.account||'').toLowerCase().includes(query)).length;
  platforms.forEach(p => {
    const el = document.getElementById('badge-' + p);
    if (el) el.textContent = allFlat.filter(r => r.platform === p).length;
  });

  // Stats
  const datedCount = allFlat.filter(r => r.date && r.date !== 'unknown').length;
  document.getElementById('total-count').textContent = allFlat.length;
  document.getElementById('dated-count').textContent = datedCount;

  // Newest post
  const allDated = allFlat.filter(r => r.date && r.date !== 'unknown');
  allDated.sort((a,b) => new Date(b.date) - new Date(a.date));
  if (allDated.length > 0) {
    const newest = allDated[0];
    document.getElementById('newestBanner').style.display = 'block';
    document.getElementById('newestDateText').textContent = formatDisplayDate(newest.date) || newest.date;
    document.getElementById('newestPlatformText').textContent = '（' + newest.platform + ' · @' + (newest.account || '—') + '）';
  }

  // Sort
  flat = sortResults(flat, sortMode);

  if (flat.length === 0) {
    document.getElementById('no-results').style.display = 'block';
    return;
  }
  document.getElementById('no-results').style.display = 'none';

  // Group by platform if sort=platform, else flat list
  if (sortMode === 'platform') {
    const groups = {};
    flat.forEach(r => {
      if (!groups[r.platform]) groups[r.platform] = [];
      groups[r.platform].push(r);
    });
    Object.keys(groups).forEach(platform => {
      const cfg = PLATFORM_CONFIG[platform];
      const items = groups[platform];
      const newestInGroup = items.filter(r => r.date && r.date !== 'unknown').sort((a,b) => new Date(b.date)-new Date(a.date))[0];
      const sectionEl = document.createElement('div');
      sectionEl.innerHTML = `
        <div class="section-header">
          <div class="platform-icon ${cfg.iconCls}">${cfg.icon}</div>
          <span class="section-title">${platform}</span>
          ${newestInGroup ? `<span class="section-newest">最新：${formatDisplayDate(newestInGroup.date)}</span>` : ''}
          <span class="section-count">${items.length} 個結果</span>
        </div>
        <div class="cards-grid">${items.map(r => cardHTML(r, cfg, allDated[0])).join('')}</div>
      `;
      container.appendChild(sectionEl);
    });
  } else {
    // Flat grid
    const grid = document.createElement('div');
    grid.className = 'cards-grid';
    grid.innerHTML = flat.map(r => cardHTML(r, PLATFORM_CONFIG[r.platform], allDated[0])).join('');
    container.appendChild(grid);
  }
}

function cardHTML(r, cfg, newestItem) {
  const isNewest = newestItem && r.url === newestItem.url;
  const displayDate = formatDisplayDate(r.date);
  const isSocial = isSocialPlatform(r.platform);
  let dateBadge = '';
  if (displayDate) {
    const cls = isSocial ? 'post-date social' : 'post-date';
    const label = isSocial ? '📅 出帖日期' : '📅 發布日期';
    dateBadge = `<span class="${cls}">${label}：${displayDate}</span>`;
  } else {
    dateBadge = `<span class="post-date unknown">📅 日期未知</span>`;
  }

  return `
    <div class="card${isNewest ? ' is-newest' : ''}">
      ${isNewest ? '<span class="newest-ribbon">🔥 最新</span>' : ''}
      <span class="card-platform ${cfg.cls}">${cfg.icon} ${r.platform}</span>
      <div class="card-title">${escHtml(r.title)}</div>
      <div class="card-summary">${escHtml(r.summary || '')}</div>
      <div class="card-meta">
        ${r.account ? `<span class="account">@${escHtml(r.account)}</span>` : ''}
        ${dateBadge}
      </div>
      <a class="card-link" href="${escAttr(r.url)}" target="_blank" rel="noopener noreferrer">
        🔗 前往連結
      </a>
    </div>
  `;
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(str) {
  return String(str).replace(/"/g,'&quot;');
}

// ── INIT ──
renderAll();
</script>
</body>
